name: feed

# Builds package/ for every sdk/*.env and publishes signed apk feeds with the public key on
# GitHub Pages (layout: .github/feed-site.sh): <pages>/<release>/packages/<arch>/ and
# <pages>/<release>/targets/<target>/.
# Only package inputs trigger a build: a rebuild would republish the same versions with new
# hashes. After editing this workflow or a script in .github/, start it by hand
# (workflow_dispatch).
on:
  push:
    branches: [main]
    paths: [package/**, sdk/**, build.sh, prebuilt.list, keys/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  sdks:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ls
        run: echo "list=$(ls sdk/*.env | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build:
    needs: sdks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: ${{ fromJSON(needs.sdks.outputs.list) }}
    env:
      SDK_ENV: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y gawk gettext libncurses-dev rsync unzip zstd file
      - run: ./build.sh "$SDK_ENV"
      # The key only exists after the SDK build (third-party code) has finished, and the script
      # deletes it before running the SDK's index scripts.
      - name: Sign feeds
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: .github/feed-site.sh "$SDK_ENV" site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-${{ strategy.job-index }}
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: feed-*
          path: parts
      # Two targets of one release with the same arch would both write <release>/packages/<arch>/
      # and overwrite each other's files (index and packages from different builds): stop instead.
      - run: |
          dup=$(cd parts && ls -d */*/packages/* | cut -d/ -f2- | sort | uniq -d)
          [ -z "$dup" ] || { echo "packages feed built by two targets: $dup" >&2; exit 1; }
          mkdir site
          for p in parts/*/; do cp -r "$p". site/; done
          cp -r keys site/
      # An "Index of" page per directory (the root one has the install commands); fails on a
      # broken link before anything is published.
      - run: python3 -I .github/pages-index.py site "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
